name: basic_test_workflow
dag_type: plain_text
description: A minimal workflow that defines a test objective, generates test cases,
  runs them, collects raw results, and produces a summary report.
nodes:
  define_test_objective:
    name: define_test_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Write a concise sentence describing the overall objective of this test
      (e.g., verify that a function returns the correct output for given inputs).
    description: State the purpose and scope of the test to be performed.
    agent: false
  prepare_test_environment:
    name: prepare_test_environment
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List all packages, libraries, files, and configuration settings needed
      to run the test. Provide each item on a separate line.
    description: Specify any required setup such as dependencies, data files, or runtime
      configuration.
    agent: false
  generate_test_cases:
    name: generate_test_cases
    nodes_depended_on:
    - define_test_objective
    nodes_dependent_on: []
    prompt: Based on the test objective, produce at least five distinct test cases.
      For each case, give the input values and the expected result.
    description: Create a set of independent test inputs and expected outputs.
    agent: false
  execute_test_cases:
    name: execute_test_cases
    nodes_depended_on:
    - prepare_test_environment
    - generate_test_cases
    nodes_dependent_on: []
    prompt: 'Simulate execution of each test case and record the actual result for
      each. Return a list of objects with fields: case_id, actual_output.'
    description: Run each test case in the prepared environment and capture the actual
      output.
    agent: false
  compare_results:
    name: compare_results
    nodes_depended_on:
    - generate_test_cases
    - execute_test_cases
    nodes_dependent_on: []
    prompt: 'For each test case, compare the actual_output to the expected result
      and indicate whether it passed. Output a table with columns: case_id, expected,
      actual, status.'
    description: Compare actual outputs to expected outputs and flag pass/fail for
      each case.
    agent: false
  summarize_test_report:
    name: summarize_test_report
    nodes_depended_on:
    - compare_results
    nodes_dependent_on: []
    prompt: Based on the comparison table, write a brief report stating the total
      number of tests, how many passed, how many failed, and any notable observations.
    description: Produce a high‑level summary of the testing outcome.
    agent: false

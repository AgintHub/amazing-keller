name: basic_test_workflow
dag_type: plain_text
description: Generated workflow from UI.
nodes:
  prepare_test_environment:
    name: prepare_test_environment
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Create a temporary folder named `test_env` in the current working directory.
      Verify that the `echo` command is available. Return a JSON object with a boolean
      field `environment_ready` indicating success.
    description: Create a temporary directory and ensure required tools are available
      for the test.
    agent: false
  execute_test:
    name: execute_test
    nodes_depended_on:
    - prepare_test_environment
    nodes_dependent_on: []
    prompt: If `environment_ready` is true, change into the `test_env` directory and
      execute `echo TEST_PASSED`. Capture the standard output string and return it
      as `raw_output`.
    description: Run a simple test command inside the prepared environment and capture
      its stdout.
    agent: false
  collect_test_output:
    name: collect_test_output
    nodes_depended_on:
    - execute_test
    nodes_dependent_on: []
    prompt: Inspect `raw_output`. If it contains the substring `TEST_PASSED`, set
      `test_status` to `PASS`; otherwise set it to `FAIL`. Return a JSON object with
      fields `test_status` and `raw_output`.
    description: Process the raw output from the test command and determine pass/fail
      status.
    agent: false
  summarize_test_results:
    name: summarize_test_results
    nodes_depended_on:
    - collect_test_output
    nodes_dependent_on: []
    prompt: Produce a short paragraph summarizing the test result, mentioning the
      `test_status` and including the exact `raw_output` string. Return the summary
      as `final_report`.
    description: Generate a concise human‑readable summary of the test execution.
    agent: false

  summarize_test_results:
    agent: false
    code_node_type: shim
    description: Creates a human-readable summary of test execution results, preserving
      formatting, by including the exact raw output wrapped in backticks.
    implementation: "from ._summarize_test_results.format_test_summary import format_test_summary\n\
      \nfrom pydantic import BaseModel, Field\n\n\nclass CollectTestOutputOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for collect_test_output node outputs.\"\"\"\n    test_status:\
      \ str = (\n        Field(..., description = (\n            \"Literal string\
      \ indicating the test status, either \"PASSED\" or \"FAILED\"\")\n        )\n\
      \    )\n    raw_output: str = (\n        Field(..., description = (\n      \
      \      \"Original captured output string, preserved exactly as received\")\n\
      \        )\n    )\n\n\nclass SummarizeTestResultsOutput(BaseModel):\n    \"\"\
      \"Pydantic model for summarize_test_results node outputs.\"\"\"\n    summary:\
      \ str = (\n        Field(..., description = (\n            \"A single paragraph\
      \ that states the test outcome, includes the exact raw output wrapped in backticks,\
      \ and is formatted for clear, standalone logging or display.\")\n        )\n\
      \    )\n\n\ndef summarize_test_results(collect_test_output_input: CollectTestOutputOutput,\
      \ **kwargs) -> SummarizeTestResultsOutput:\n    \"\"\"\n    Generate a concise\
      \ summary of test execution results.\n\n    Parameters\n    ----------\n   \
      \ raw_output : str\n        Raw output string from the collect_test_output node,\
      \ including test\n        status and any output content.\n\n    Returns\n  \
      \  -------\n    str\n        Human-readable summary of test execution results,\
      \ including the\n        exact raw_output value wrapped in backticks.\n\n  \
      \  Raises\n    ------\n    ValueError\n        If raw_output is not a valid\
      \ JSON string or test_status is neither\n        'PASSED' nor 'FAILED'.\n\n\
      \    Examples\n    --------\n    >>> summarize_test_results('TEST_PASSED\nThis\
      \ is a test report.')\n    Pass: 'TEST_PASSED\n    This is a test report.'\n\
      \n    \"\"\"\n    test_status = collect_test_output_input.test_status\n    raw_output\
      \ = collect_test_output_input.raw_output\n    \n    formatted_summary: str =\
      \ format_test_summary(\n        test_status=test_status,\n        raw_output=raw_output\n\
      \    )\n    \n    return SummarizeTestResultsOutput(\n        summary=formatted_summary\n\
      \    )"

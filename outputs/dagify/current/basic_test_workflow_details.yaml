dag_type: shim
description: Generated workflow from UI.
name: basic_test_workflow
nodes:
  collect_test_output:
    agent: false
    code_node_type: stub
    description: Collects test output and sets test status based on 'TEST_PASSED'
      presence.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass ExecuteTestOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for execute_test node outputs.\"\"\"\n    raw_output:\
      \ str = (\n        Field(..., description = (\n            \"The command\\u2019s\
      \ standard output, including any trailing newline.\")\n        )\n    )\n  \
      \  passed: bool = (\n        Field(..., description=\"Whether the output matched\
      \ the expectation.\")\n    )\n\n\nclass CollectTestOutputOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for collect_test_output node outputs.\"\"\"\n    test_status:\
      \ str = (\n        Field(..., description = (\n            \"Literal string\
      \ indicating the test status, either \"PASSED\" or \"FAILED\"\")\n        )\n\
      \    )\n    raw_output: str = (\n        Field(..., description = (\n      \
      \      \"Original captured output string, preserved exactly as received\")\n\
      \        )\n    )\n\n\ndef collect_test_output(execute_test_input: ExecuteTestOutput,\
      \ **kwargs) -> CollectTestOutputOutput:\n    \"\"\"\n    Collects test output\
      \ and sets test status.\n\n    Parameters\n    ----------\n    raw_output :\
      \ str\n        String supplied by the execute_test node.\n\n    Returns\n  \
      \  -------\n    dict\n        Dictionary with test_status and raw_output matching\
      \ the declared\n        output_structure.\n\n    Raises\n    ------\n    ValueError\n\
      \        If the input string is empty or contains only whitespace.\n\n    Examples\n\
      \    --------\n    >>> parse_test_output('TEST_PASSED\nTest Output')\n    {'test_status':\
      \ 'PASSED', 'raw_output': 'TEST_PASSED\\nTest Output'}\n\n    >>> parse_test_output('Test\
      \ Output')\n    {'test_status': 'FAILED', 'raw_output': 'Test Output'}\n\n \
      \   \"\"\"\n    return CollectTestOutputOutput(\n        test_status=\"\",\n\
      \        raw_output=\"\",\n    )"
    name: collect_test_output
    nodes_depended_on:
    - execute_test
    nodes_dependent_on: []
    output_structure:
    - description: Literal string indicating the test status, either "PASSED" or "FAILED"
      key: test_status
      type: str
    - description: Original captured output string, preserved exactly as received
      key: raw_output
      type: str
    prd:
      conceptual_info: This node parses the test execution output from the execute_test
        node and assigns a pass/fail status based on whether the 'TEST_PASSED' substring
        is present. It returns a clean JSON object with test_status and raw_output
        preserved from the original output.
      docstring:
        examples:
        - lines:
          - 'parse_test_output(''TEST_PASSED

            Test Output'')'
          output: '{''test_status'': ''PASSED'', ''raw_output'': ''TEST_PASSED\nTest
            Output''}'
        - lines:
          - parse_test_output('Test Output')
          output: '{''test_status'': ''FAILED'', ''raw_output'': ''Test Output''}'
        parameters:
        - description: String supplied by the execute_test node.
          name: raw_output
          type: str
        raises:
        - description: If the input string is empty or contains only whitespace.
          type: ValueError
        returns:
          description: Dictionary with test_status and raw_output matching the declared
            output_structure.
          type: dict
        summary: Collects test output and sets test status.
    prompt: 'Read the `raw_output` string supplied by the `execute_test` node. Search
      the string for the exact substring `TEST_PASSED`. If the substring is found,
      set the field `test_status` to the string "PASSED"; otherwise set it to "FAILED".
      Construct a JSON object with two keys:


      - `test_status`: a literal string either "PASSED" or "FAILED".

      - `raw_output`: the original captured output string, preserved exactly as received
      (including all whitespace, line breaks, and any trailing newline).


      Return this JSON object as the sole output of the node.'
    shims: []
  execute_test:
    agent: false
    code_node_type: stub
    description: Runs a deterministic echo command inside the isolated test environment,
      captures its exact standard output—including the trailing newline—and validates
      it against the predefined expected string.
    implementation: "from pydantic import BaseModel, Field\n\n\nclass PrepareTestEnvironmentOutput(BaseModel):\n\
      \    \"\"\"Pydantic model for prepare_test_environment node outputs.\"\"\"\n\
      \    env_dir: str = (\n        Field(..., description = (\n            \"Absolute\
      \ path of the isolated temporary directory\")\n        )\n    )\n    utils_ok:\
      \ bool = (\n        Field(..., description = (\n            \"Whether the essential\
      \ system utilities are verified and available\")\n        )\n    )\n    permissions_ok:\
      \ bool = (\n        Field(..., description = (\n            \"Whether the new\
      \ directory has mode `0700` and is isolated\")\n        )\n    )\n    symlinks_ok:\
      \ bool = (\n        Field(..., description=\"Whether the new directory contains\
      \ no symlinks\")\n    )\n    cleanup_command: str = (\n        Field(..., description\
      \ = (\n            \"Shell command to safely remove the directory after tests\
      \ complete\")\n        )\n    )\n    summary: str = (\n        Field(..., description\
      \ = (\n            \"Summary of the environment setup, including success/failure\
      \ status for each check and relevant environment variables\")\n        )\n \
      \   )\n\n\nclass ExecuteTestOutput(BaseModel):\n    \"\"\"Pydantic model for\
      \ execute_test node outputs.\"\"\"\n    raw_output: str = (\n        Field(...,\
      \ description = (\n            \"The command\\u2019s standard output, including\
      \ any trailing newline.\")\n        )\n    )\n    passed: bool = (\n       \
      \ Field(..., description=\"Whether the output matched the expectation.\")\n\
      \    )\n\n\ndef execute_test(prepare_test_environment_input: PrepareTestEnvironmentOutput,\
      \ **kwargs) -> ExecuteTestOutput:\n    \"\"\"\n    Run a deterministic echo\
      \ command and validate its output.\n\n    Parameters\n    ----------\n    env_dir\
      \ : str\n        AbsolutePath to the isolated test environment directory.\n\
      \    expected_string : str\n        Predefined expected string to be validated\
      \ against the command’s\n        standard output.\n\n    Returns\n    -------\n\
      \    dict\n        Dictionary containing the declared output fields: `raw_output`\
      \ and\n        `passed`.\n\n    Raises\n    ------\n    ValueError\n       \
      \ If the environment directory is unavailable or the expected string\n     \
      \   is empty.\n\n    Examples\n    --------\n    >>> execute_test(env_dir='/test/env',\
      \ expected_string='TEST_PASSED')\n    {'raw_output': 'TEST_PASSED\\n', 'passed':\
      \ True}\n\n    \"\"\"\n    return ExecuteTestOutput(\n        raw_output=\"\"\
      ,\n        passed=False,\n    )"
    name: execute_test
    nodes_depended_on:
    - prepare_test_environment
    nodes_dependent_on: []
    output_structure:
    - description: The command’s standard output, including any trailing newline.
      key: raw_output
      type: str
    - description: Whether the output matched the expectation.
      key: passed
      type: bool
    prd:
      conceptual_info: Validate the exact output of a deterministic echo command inside
        a prepared isolated environment against a predefined expected string.
      docstring:
        examples:
        - lines:
          - execute_test(env_dir='/test/env', expected_string='TEST_PASSED')
          output: '{''raw_output'': ''TEST_PASSED\n'', ''passed'': True}'
        parameters:
        - description: AbsolutePath to the isolated test environment directory.
          name: env_dir
          type: str
        - description: Predefined expected string to be validated against the command’s
            standard output.
          name: expected_string
          type: str
        raises:
        - description: If the environment directory is unavailable or the expected
            string is empty.
          type: ValueError
        returns:
          description: 'Dictionary containing the declared output fields: `raw_output`
            and `passed`.'
          type: dict
        summary: Run a deterministic echo command and validate its output.
    prompt: 'Navigate to the test environment directory and execute the system echo
      binary with the exact argument `TEST_PASSED`:'
    shims: []
  prepare_test_environment:
    agent: false
    code_node_type: shim
    description: Creates an isolated temporary directory for testing, verifies that
      essential system utilities are available, and records all necessary information
      to enable safe cleanup. Returns a JSON object with fields `env_dir`, `utils_ok`,
      `permissions_ok`, `symlinks_ok`, `cleanup_command`, and a summary of the environment
      setup.
    implementation: "from ._prepare_test_environment.create_unique_temp_directory\
      \ import create_unique_temp_directory\nfrom ._prepare_test_environment.get_absolute_path\
      \ import get_absolute_path\nfrom ._prepare_test_environment.verify_utility_availability\
      \ import verify_utility_availability\nfrom ._prepare_test_environment.check_directory_permissions\
      \ import check_directory_permissions\nfrom ._prepare_test_environment.verify_directory_isolation\
      \ import verify_directory_isolation\nfrom ._prepare_test_environment.check_for_symlinks\
      \ import check_for_symlinks\nfrom ._prepare_test_environment.get_relevant_environment_variables\
      \ import get_relevant_environment_variables\nfrom ._prepare_test_environment.generate_environment_summary\
      \ import generate_environment_summary\n\nfrom pydantic import BaseModel, Field\n\
      \n\nclass PrepareTestEnvironmentOutput(BaseModel):\n    \"\"\"Pydantic model\
      \ for prepare_test_environment node outputs.\"\"\"\n    env_dir: str = (\n \
      \       Field(..., description = (\n            \"Absolute path of the isolated\
      \ temporary directory\")\n        )\n    )\n    utils_ok: bool = (\n       \
      \ Field(..., description = (\n            \"Whether the essential system utilities\
      \ are verified and available\")\n        )\n    )\n    permissions_ok: bool\
      \ = (\n        Field(..., description = (\n            \"Whether the new directory\
      \ has mode `0700` and is isolated\")\n        )\n    )\n    symlinks_ok: bool\
      \ = (\n        Field(..., description=\"Whether the new directory contains no\
      \ symlinks\")\n    )\n    cleanup_command: str = (\n        Field(..., description\
      \ = (\n            \"Shell command to safely remove the directory after tests\
      \ complete\")\n        )\n    )\n    summary: str = (\n        Field(..., description\
      \ = (\n            \"Summary of the environment setup, including success/failure\
      \ status for each check and relevant environment variables\")\n        )\n \
      \   )\n\n\ndef prepare_test_environment(general_input: str, **kwargs) -> PrepareTestEnvironmentOutput:\n\
      \    \"\"\"\n    Setup isolated temporary directory and verify utilities for\
      \ testing.\n\n    Parameters\n    ----------\n    current_working_directory\
      \ : str\n        The current working directory where the temporary directory\
      \ will be\n        created.\n\n    Returns\n    -------\n    dict\n        Dictionary\
      \ containing the declared output fields.\n\n    Raises\n    ------\n    ValueError\n\
      \        If an input is invalid or cannot be resolved.\n\n    Examples\n   \
      \ --------\n    >>> import os\n    >>> import tempfile\n    >>> import which\n\
      \    >>> import pwd\n    >>> import grp\n    >>> import stat\n    {'env_dir':\
      \ '/tmp/test_env.XXXXXX', 'utils_ok': True, 'permissions_ok':\n    True, 'symlinks_ok':\
      \ True, 'cleanup_command': 'rm -rf /tmp/test_env.XXXXXX',\n    'summary': 'Environment\
      \ setup successful.'}\n\n    \"\"\"\n    temp_dir_path: str = create_unique_temp_directory()\n\
      \    env_dir_absolute: str = get_absolute_path(path=temp_dir_path)\n    \n \
      \   echo_path: str = verify_utility_availability(utility=\"echo\")\n    ls_path:\
      \ str = verify_utility_availability(utility=\"ls\")\n    mkdir_path: str = verify_utility_availability(utility=\"\
      mkdir\")\n    utils_available: bool = bool(echo_path and ls_path and mkdir_path)\n\
      \    \n    directory_mode: str = check_directory_permissions(directory=env_dir_absolute)\n\
      \    is_isolated: bool = verify_directory_isolation(directory=env_dir_absolute)\n\
      \    permissions_valid: bool = directory_mode == \"0700\" and is_isolated\n\
      \    \n    has_symlinks: bool = check_for_symlinks(directory=env_dir_absolute)\n\
      \    symlinks_valid: bool = not has_symlinks\n    \n    cleanup_cmd: str = f\"\
      rm -rf \\\"{env_dir_absolute}\\\"\"\n    \n    environment_vars: dict = get_relevant_environment_variables()\n\
      \    setup_summary: str = generate_environment_summary(\n        env_dir=env_dir_absolute,\n\
      \        utils_ok=utils_available,\n        permissions_ok=permissions_valid,\n\
      \        symlinks_ok=symlinks_valid,\n        env_vars=environment_vars\n  \
      \  )\n    \n    return PrepareTestEnvironmentOutput(\n        env_dir=env_dir_absolute,\n\
      \        utils_ok=utils_available,\n        permissions_ok=permissions_valid,\n\
      \        symlinks_ok=symlinks_valid,\n        cleanup_command=cleanup_cmd,\n\
      \        summary=setup_summary\n    )"
    name: prepare_test_environment
    nodes_depended_on: []
    nodes_dependent_on: []
    output_structure:
    - description: Absolute path of the isolated temporary directory
      key: env_dir
      type: str
    - description: Whether the essential system utilities are verified and available
      key: utils_ok
      type: bool
    - description: Whether the new directory has mode `0700` and is isolated
      key: permissions_ok
      type: bool
    - description: Whether the new directory contains no symlinks
      key: symlinks_ok
      type: bool
    - description: Shell command to safely remove the directory after tests complete
      key: cleanup_command
      type: str
    - description: Summary of the environment setup, including success/failure status
        for each check and relevant environment variables
      key: summary
      type: str
    prd:
      conceptual_info: This node sets up an isolated temporary directory for testing
        by creating a unique directory, verifying the availability and executability
        of essential system utilities, checking directory permissions and symlinks,
        and recording the results. It then generates a cleanup command and returns
        a structured summary of the environment setup.
      docstring:
        examples:
        - lines:
          - import os
          - import tempfile
          - import which
          - import pwd
          - import grp
          - import stat
          output: '{''env_dir'': ''/tmp/test_env.XXXXXX'', ''utils_ok'': True, ''permissions_ok'':
            True, ''symlinks_ok'': True, ''cleanup_command'': ''rm -rf /tmp/test_env.XXXXXX'',
            ''summary'': ''Environment setup successful.''}'
        parameters:
        - description: The current working directory where the temporary directory
            will be created.
          name: current_working_directory
          type: str
        raises:
        - description: If an input is invalid or cannot be resolved.
          type: ValueError
        returns:
          description: Dictionary containing the declared output fields.
          type: dict
        summary: Setup isolated temporary directory and verify utilities for testing.
    prompt: '1. Create a uniquely named temporary directory (e.g., using `mktemp -d
      -t test_env.XXXXXX`) in the current working directory and capture its absolute
      path.

      2. Verify the presence and executability of the utilities `echo`, `ls`, and
      `mkdir` by resolving their paths with `which` and checking the executable flag.

      3. Confirm that the new directory is isolated: ensure it has mode `0700`, contains
      no symlinks, and its parent path is not a mount point that could expose sensitive
      data.

      4. Record the results of each check in a structured format (e.g., a JSON object
      with fields `env_dir`, `utils_ok`, `permissions_ok`, `symlinks_ok`).

      5. Generate a cleanup shell command (`rm -rf "${env_dir}"` ) that safely removes
      the directory after tests complete.

      6. Return a structured summary of the environment setup, including success/failure
      status for each check, any relevant environment variables (e.g., `PATH`), and
      a cleanup command.'
    shims:
    - agent: false
      code_node_type: virtual-stub
      description: Creates a typed node for generating a unique temporary directory
      implementation: "def create_unique_temp_directory() -> str:\n    \"\"\"\n  \
        \  Creates a unique temporary directory\n\n    Parameters\n    ----------\n\
        \    input_params : dict\n        Input parameters for the shim\n\n    Returns\n\
        \    -------\n    str\n        The path to the created unique temporary directory\n\
        \n    Raises\n    ------\n    ValueError\n        When input validation fails\n\
        \    TypeError\n        When input types are incorrect\n\n    Examples\n \
        \   --------\n    >>> temp_dir_path = create_unique_temp_directory()\n   \
        \ Absolute path of a unique temporary directory\n\n    >>> temp_dir_path =\
        \ create_unique_temp_directory(input_params={'foo':\n    'bar'})\n    Absolute\
        \ path of a unique temporary directory with 'bar'\n\n    \"\"\"\n    raise\
        \ NotImplementedError(\"This is a virtual stub node that needs to be implemented\"\
        )"
      name: create_unique_temp_directory
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      prd:
        conceptual_info: This shim node creates a unique temporary directory for preparation
          of the test environment.
        docstring:
          examples:
          - lines:
            - temp_dir_path = create_unique_temp_directory()
            output: Absolute path of a unique temporary directory
          - lines:
            - 'temp_dir_path = create_unique_temp_directory(input_params={''foo'':
              ''bar''})'
            output: Absolute path of a unique temporary directory with 'bar'
          parameters:
          - description: Input parameters for the shim
            name: input_params
            type: dict
          raises:
          - description: When input validation fails
            type: ValueError
          - description: When input types are incorrect
            type: TypeError
          returns:
            description: The path to the created unique temporary directory
            type: str
          summary: Creates a unique temporary directory
      prompt: Typed node for shim create_unique_temp_directory
      selected_tools: []
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Retrieve the absolute path of a given directory or file.
      implementation: "def get_absolute_path(path: str) -> str:\n    \"\"\"\n    Obtain\
        \ the absolute path of a directory or file.\n\n    Parameters\n    ----------\n\
        \    path : str\n        The path for which the absolute path is to be retrieved.\n\
        \n    Returns\n    -------\n    STR\n        The absolute path of the directory\
        \ or file.\n\n    Raises\n    ------\n    ValueError\n        When the input\
        \ path does not exist or is invalid.\n    TypeError\n        When the input\
        \ path is not a string.\n\n    Examples\n    --------\n    >>> get_absolute_path('/home/user')\n\
        \    /home/user\n\n    >>> get_absolute_path('./current_directory')\n    /current_directory\n\
        \n    \"\"\"\n    raise NotImplementedError(\"This is a virtual stub node\
        \ that needs to be implemented\")"
      name: get_absolute_path
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: path
        type: str
      prd:
        conceptual_info: A shim responsible for obtaining the absolute path of a given
          directory or file.
        docstring:
          examples:
          - lines:
            - get_absolute_path('/home/user')
            output: /home/user
          - lines:
            - get_absolute_path('./current_directory')
            output: /current_directory
          parameters:
          - description: The path for which the absolute path is to be retrieved.
            name: path
            type: str
          raises:
          - description: When the input path does not exist or is invalid.
            type: ValueError
          - description: When the input path is not a string.
            type: TypeError
          returns:
            description: The absolute path of the directory or file.
            type: STR
          summary: Obtain the absolute path of a directory or file.
      prompt: Provide the absolute path for a directory or file.
      selected_tools: []
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Verifies the availability of a utility on the system by checking
        its absolute path.
      implementation: "def verify_utility_availability(utility: str) -> str:\n   \
        \ \"\"\"\n    Verifies a system utility by checking its existence at a specific\
        \ path.\n\n    Parameters\n    ----------\n    utility : str\n        The\
        \ name of the utility to verify (e.g., `echo`, `ls`, `mkdir`).\n\n    Returns\n\
        \    -------\n    dict\n        A dictionary containing the utility name and\
        \ its absolute path if\n        found, otherwise `None` for the utility.\n\
        \n    Raises\n    ------\n    ValueError\n        When the utility is not\
        \ found or an error occurs while checking its\n        presence.\n    TypeError\n\
        \        When the input type is incorrect or the utility name is invalid.\n\
        \n    Examples\n    --------\n    >>> verify_utility_availability(utility='echo')\n\
        \    >>> verify_utility_availability(utility='non-existent-utility')\n   \
        \ {'output': '/bin/echo', 'utility': 'echo'}\n    None\n\n    \"\"\"\n   \
        \ raise NotImplementedError(\"This is a virtual stub node that needs to be\
        \ implemented\")"
      name: verify_utility_availability
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: utility
        type: str
      prd:
        conceptual_info: The shim verifies the presence of a system utility by checking
          its absolute path.
        docstring:
          examples:
          - lines:
            - verify_utility_availability(utility='echo')
            - verify_utility_availability(utility='non-existent-utility')
            output: '{''output'': ''/bin/echo'', ''utility'': ''echo''}

              None'
          parameters:
          - description: The name of the utility to verify (e.g., `echo`, `ls`, `mkdir`).
            name: utility
            type: str
          raises:
          - description: When the utility is not found or an error occurs while checking
              its presence.
            type: ValueError
          - description: When the input type is incorrect or the utility name is invalid.
            type: TypeError
          returns:
            description: A dictionary containing the utility name and its absolute
              path if found, otherwise `None` for the utility.
            type: dict
          summary: Verifies a system utility by checking its existence at a specific
            path.
      prompt: Verify utility availability on this system
      selected_tools: []
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Verifies the mode of a given directory and returns its mode as
        a string.
      implementation: "def check_directory_permissions(directory: str) -> str:\n \
        \   \"\"\"\n    Checks the directory permissions of a given directory.\n\n\
        \    Parameters\n    ----------\n    directory : str\n        Path to the\
        \ directory to check.\n\n    Returns\n    -------\n    str\n        Mode of\
        \ the directory as a string.\n\n    Raises\n    ------\n    ValueError\n \
        \       When the directory path is invalid.\n    TypeError\n        When the\
        \ input type is incorrect.\n\n    Examples\n    --------\n    >>> check_directory_permissions('/path/to/directory')\n\
        \    '0700'\n\n    >>> check_directory_permissions('/another/directory')\n\
        \    'another_mode'\n\n    \"\"\"\n    raise NotImplementedError(\"This is\
        \ a virtual stub node that needs to be implemented\")"
      name: check_directory_permissions
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type str
        key: output
        type: str
      - description: Input parameter of type str
        key: directory
        type: str
      prd:
        conceptual_info: The shim `check_directory_permissions` is used to validate
          directory permissions and provide its mode as a string.
        docstring:
          examples:
          - lines:
            - check_directory_permissions('/path/to/directory')
            output: '''0700'''
          - lines:
            - check_directory_permissions('/another/directory')
            output: '''another_mode'''
          parameters:
          - description: Path to the directory to check.
            name: directory
            type: str
          raises:
          - description: When the directory path is invalid.
            type: ValueError
          - description: When the input type is incorrect.
            type: TypeError
          returns:
            description: Mode of the directory as a string.
            type: str
          summary: Checks the directory permissions of a given directory.
      prompt: Check if a directory has the correct mode
      selected_tools: []
      shims: []
    - agent: false
      code_node_type: virtual-stub
      description: Verifies whether the directory is properly isolated to prevent
        unauthorized access.
      implementation: "def verify_directory_isolation(directory: str) -> bool:\n \
        \   \"\"\"\n    Verifies whether a directory is properly isolated to prevent\
        \ unauthorized\n    access.\n\n    Parameters\n    ----------\n    directory\
        \ : STR\n        Path to the directory being checked for isolation.\n\n  \
        \  Returns\n    -------\n    dict\n        A dictionary containing a boolean\
        \ indicating whether the isolated\n        directory is accessible only by\
        \ the owner, and the directory path\n        being checked.\n\n    Raises\n\
        \    ------\n    ValueError\n        Raised when the input directory path\
        \ is invalid or the directory\n        does not exist.\n    PermissionError\n\
        \        Raised when the shim lacks permission to access the directory being\n\
        \        checked for isolation.\n\n    Examples\n    --------\n    >>> print(verify_directory_isolation('/home/user/isolated_dir'))\n\
        \    >>> print(verify_directory_isolation('/home/user/public_dir'))\n    {'output':\
        \ True, 'directory': '/home/user/isolated_dir'}\n    {'output': False, 'directory':\
        \ '/home/user/public_dir'}\n\n    \"\"\"\n    raise NotImplementedError(\"\
        This is a virtual stub node that needs to be implemented\")"
      name: verify_directory_isolation
      nodes_depended_on: []
      nodes_dependent_on: []
      output_structure:
      - description: Output of type bool
        key: output
        type: bool

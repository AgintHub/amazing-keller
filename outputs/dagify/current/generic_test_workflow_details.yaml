name: generic_test_workflow
dag_type: plain_text
description: A detailed workflow that defines, prepares, executes, and reports on
  a generic test suite for a software component.
nodes:
  gather_test_requirements:
    name: gather_test_requirements
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: List the functional and non‑functional requirements that the software
      component must satisfy. Provide each requirement as a short bullet point.
    description: Collect the set of requirements that the test suite must verify.
    agent: false
  define_test_cases:
    name: define_test_cases
    nodes_depended_on:
    - gather_test_requirements
    nodes_dependent_on: []
    prompt: 'Based on the supplied requirements, write individual test cases. For
      each case include: ID, description, pre‑conditions, input data, expected outcome,
      and pass/fail criteria.'
    description: Create atomic test cases that directly map to the gathered requirements.
    agent: false
  prepare_test_environment:
    name: prepare_test_environment
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Describe the hardware, OS, software dependencies, configuration files,
      and any mock services needed to run the tests. Output a step‑by‑step setup checklist.
    description: Specify everything required to provision a reproducible test environment.
    agent: false
  install_dependencies:
    name: install_dependencies
    nodes_depended_on:
    - prepare_test_environment
    nodes_dependent_on: []
    prompt: Provide commands to install all libraries, packages, and tools listed
      in the environment checklist. Assume a Unix‑like shell.
    description: Execute the installation of all necessary dependencies.
    agent: false
  configure_test_suite:
    name: configure_test_suite
    nodes_depended_on:
    - define_test_cases
    - install_dependencies
    nodes_dependent_on: []
    prompt: Generate configuration files (e.g., pytest.ini, jest.config.js) that load
      the test cases defined earlier. Ensure paths and parameters match the environment.
    description: Set up the test runner with the created test cases.
    agent: false
  execute_tests:
    name: execute_tests
    nodes_depended_on:
    - configure_test_suite
    nodes_dependent_on: []
    prompt: Run the test suite using the appropriate command (e.g., `pytest`, `npm
      test`). Capture stdout, stderr, and exit codes for each test case.
    description: Perform the actual execution of all test cases.
    agent: false
  collect_test_results:
    name: collect_test_results
    nodes_depended_on:
    - execute_tests
    nodes_dependent_on: []
    prompt: 'Parse the raw test output and produce a structured JSON report containing:
      test ID, status (pass/fail), execution time, and any error messages.'
    description: Transform raw output into a machine‑readable results dataset.
    agent: false
  generate_summary_report:
    name: generate_summary_report
    nodes_depended_on:
    - collect_test_results
    nodes_dependent_on: []
    prompt: Summarize the JSON results into a concise human‑readable report. Include
      total tests, passed, failed, pass rate, and a brief comment on failures.
    description: Create a high‑level summary for stakeholders.
    agent: false
  archive_artifacts:
    name: archive_artifacts
    nodes_depended_on:
    - collect_test_results
    - generate_summary_report
    nodes_dependent_on: []
    prompt: Package the structured JSON results, the summary report, and any log files
      into a zip archive named `test_artifacts_<timestamp>.zip`.
    description: Bundle all test outputs for future reference or CI integration.
    agent: false

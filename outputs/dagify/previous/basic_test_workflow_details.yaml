name: basic_test_workflow
dag_type: plain_text
description: Generated workflow from UI.
nodes:
  prepare_test_environment:
    name: prepare_test_environment
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Construct a temporary directory named `test_env` in the current working
      directory. Ensure the `echo`, `ls`, and `mkdir` commands are available. Return
      a JSON object with a boolean field `environment_ready` indicating success.
    description: Create a temporary working directory to isolate test dependencies.
      Verify the availability of fundamental system tools required for the test workflow.
    agent: false
  execute_test:
    name: execute_test
    nodes_depended_on:
    - prepare_test_environment
    nodes_dependent_on: []
    prompt: Given an environment prepared with required tools, execute `echo TEST_PASSED`
      inside `test_env` and capture the standard output string as `raw_output`.
    description: Run a test command inside the prepared environment and capture its
      stdout. Utilize the environment prepared by the preceding node to execute a
      simple test, capturing its stdout output and returning it in the `raw_output`
      field.
    agent: false
  collect_test_output:
    name: collect_test_output
    nodes_depended_on:
    - execute_test
    nodes_dependent_on: []
    prompt: Inspect `raw_output` from the test command for the `TEST_PASSED` substring
      to determine the test status (PASS or FAIL), and construct a JSON object with
      fields `test_status` and `raw_output` based on the inspection result.
    description: Thoroughly examine the `raw_output` from the test command, confirming
      that it clearly indicates test success (`TEST_PASSED` present) and accurately
      reports the result in a JSON object containing fields `test_status` and `raw_output`,
      as informed by the `execute_test` node.
    agent: false
  summarize_test_results:
    name: summarize_test_results
    nodes_depended_on:
    - collect_test_output
    nodes_dependent_on: []
    prompt: Produce a clear, detailed paragraph summarizing the test result, specifically
      including the test status and the exact raw output string as obtained from the
      parent node.
    description: Generate a thorough human-readable summary of the test execution,
      accurately incorporating the test status, raw output string, and any additional
      relevant details.
    agent: false

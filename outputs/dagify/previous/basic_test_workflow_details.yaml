name: basic_test_workflow
dag_type: plain_text
description: A detailed test workflow that sets up a temporary environment, runs a
  simple echo command, validates its output, and summarizes the results in a human‑readable
  paragraph.
nodes:
  prepare_test_environment:
    name: prepare_test_environment
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: Create a temporary directory called `test_env` in the current working
      directory. Confirm that the utilities `echo`, `ls`, and `mkdir` are available
      in the system PATH. Ensure the directory is isolated from other system files
      and can be removed safely after the test completes.
    description: Establish an isolated, disposable test environment and verify that
      essential system tools are present.
    agent: false
  execute_test:
    name: execute_test
    nodes_depended_on:
    - prepare_test_environment
    nodes_dependent_on: []
    prompt: Using the `test_env` directory created by the previous step, run the command
      `echo TEST_PASSED` and capture its standard output exactly as a string in the
      field `raw_output`.
    description: Run a simple echo command in the prepared environment and record
      its output.
    agent: false
  collect_test_output:
    name: collect_test_output
    nodes_depended_on:
    - execute_test
    nodes_dependent_on: []
    prompt: 'Check the `raw_output` produced by the test command for the exact substring
      `TEST_PASSED`. Construct a JSON object with two fields: `test_status` (set to
      "PASSED" if the substring is found, otherwise "FAILED") and `raw_output` containing
      the captured string.'
    description: Validate the test output and format the result as JSON.
    agent: false
  summarize_test_results:
    name: summarize_test_results
    nodes_depended_on:
    - collect_test_output
    nodes_dependent_on: []
    prompt: Generate a concise paragraph that includes the test status and the exact
      raw output string from the previous step. The summary should clearly state whether
      the test passed or failed and provide the output content.
    description: Create a human‑readable summary of the test outcome.
    agent: false

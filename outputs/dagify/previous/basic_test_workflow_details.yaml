name: basic_test_workflow
dag_type: plain_text
description: Generated workflow from UI.
nodes:
  prepare_test_environment:
    name: prepare_test_environment
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '1. Create a temporary directory named `test_env` in the current working
      directory.

      2. Verify that the utilities `echo`, `ls`, and `mkdir` exist and are executable
      by checking their paths in the system `PATH`.

      3. Ensure the `test_env` directory is isolated from other system files: confirm
      it has a unique name, proper permissions, and no symbolic links to sensitive
      paths.

      4. Document the absolute path of `test_env` and the results of the utility checks.

      5. Provide a cleanup command (`rm -rf test_env`) that can safely remove the
      directory after the test completes.

      6. Return a summary of the environment setup, including success/failure of each
      check and any relevant environment variables that were inspected.'
    description: Creates a clean, isolated temporary directory for testing, verifies
      that essential system utilities are available, and documents the setup for safe
      cleanup.
    agent: false
  execute_test:
    name: execute_test
    nodes_depended_on:
    - prepare_test_environment
    nodes_dependent_on: []
    prompt: 'Within the `test_env` directory created by the previous step, execute
      the command `echo TEST_PASSED` using the system''s `echo` binary. Capture the
      command''s standard output exactly as a string (including any trailing newline)
      and assign it to the field `raw_output`. Verify that the output matches the
      expected string `TEST_PASSED

      `. No additional text should be appended to `raw_output`.'
    description: Runs a deterministic echo command inside the isolated test environment,
      captures its exact standard output, and validates it against the expected value.
    agent: false
  collect_test_output:
    name: collect_test_output
    nodes_depended_on:
    - execute_test
    nodes_dependent_on: []
    prompt: 'Read the `raw_output` string produced by the `execute_test` node. Search
      the string for the exact substring `TEST_PASSED`. If the substring is present,
      set the field `test_status` to "PASSED"; otherwise set it to "FAILED". Construct
      a JSON object with two keys:

      - `test_status`: the string "PASSED" or "FAILED".

      - `raw_output`: the original captured output string, exactly as received (preserve
      all whitespace and line breaks).

      Return this JSON object as the sole output of the node.'
    description: Validate that the test command produced the expected success marker
      and format the result as a clean JSON object. The node checks the raw output
      for the exact success substring, assigns a pass/fail status, and returns both
      the status and the raw output for downstream consumption.
    agent: false
  summarize_test_results:
    name: summarize_test_results
    nodes_depended_on:
    - collect_test_output
    nodes_dependent_on: []
    prompt: Generate a concise paragraph that includes the test status and the exact
      raw output string from the previous step. The summary should clearly state whether
      the test passed or failed and provide the output content. Include the status
      keyword ("PASSED" or "FAILED") and the full raw_output value enclosed in backticks
      for clarity. If the raw_output contains multiline text, preserve line breaks.
      Do not add any additional commentary or formatting beyond the required information.
    description: Create a human‑readable summary of the test outcome. The node receives
      a JSON object with `test_status` and `raw_output`. It must produce a short paragraph
      that states whether the test passed or failed, includes the exact raw output
      string, and presents the information in a clear, standalone form suitable for
      logging or display.
    agent: false

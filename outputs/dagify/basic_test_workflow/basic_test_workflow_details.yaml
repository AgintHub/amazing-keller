name: basic_test_workflow
dag_type: plain_text
description: Generated workflow from UI.
nodes:
  prepare_test_environment:
    name: prepare_test_environment
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: '1. Create a uniquely named temporary directory (e.g., using `mktemp -d
      -t test_env.XXXXXX`) in the current working directory and capture its absolute
      path.

      2. Verify the presence and executability of the utilities `echo`, `ls`, and
      `mkdir` by resolving their paths with `which` and checking the executable flag.

      3. Confirm that the new directory is isolated: ensure it has mode `0700`, contains
      no symlinks, and its parent path is not a mount point that could expose sensitive
      data.

      4. Record the results of each check in a structured format (e.g., a JSON object
      with fields `env_dir`, `utils_ok`, `permissions_ok`, `symlinks_ok`).

      5. Generate a cleanup shell command (`rm -rf "${env_dir}"`) that safely removes
      the directory after tests complete.

      6. Return a concise summary of the environment setup, including success/failure
      status for each check and any relevant environment variables (e.g., `PATH`).'
    description: Creates an isolated temporary directory for testing, verifies that
      essential system utilities are available, and records all necessary information
      to enable safe cleanup.
    agent: false
  execute_test:
    name: execute_test
    nodes_depended_on:
    - prepare_test_environment
    nodes_dependent_on: []
    prompt: 'Navigate to the `test_env` directory created by the previous step. Execute
      the system `echo` binary with the exact argument `TEST_PASSED`:


      ```bash

      cd test_env && /usr/bin/echo TEST_PASSED

      ```


      Capture the command’s standard output, including any trailing newline, as a
      string and assign it to the field `raw_output`. The expected value is the literal
      string `TEST_PASSED

      `. Compare `raw_output` to this expected value and raise an error if they differ.
      Do not append any additional characters, whitespace, or logging information
      to `raw_output`.


      After verification, return a JSON object containing `raw_output` and a boolean
      field `passed` indicating whether the output matched the expectation.'
    description: Runs a deterministic echo command inside the isolated test environment,
      captures its exact standard output—including the trailing newline—and validates
      it against the predefined expected string. The node ensures the output is captured
      verbatim and reports success or failure of the match.
    agent: false
  collect_test_output:
    name: collect_test_output
    nodes_depended_on:
    - execute_test
    nodes_dependent_on: []
    prompt: 'Read the `raw_output` string supplied by the `execute_test` node. Search
      the string for the exact substring `TEST_PASSED`. If the substring is found,
      set the field `test_status` to the string "PASSED"; otherwise set it to "FAILED".
      Construct a JSON object with two keys:


      - `test_status`: a literal string either "PASSED" or "FAILED".

      - `raw_output`: the original captured output string, preserved exactly as received
      (including all whitespace, line breaks, and any trailing newline).


      Return this JSON object as the sole output of the node.


      Example output when the test passes:

      ```json

      { "test_status": "PASSED", "raw_output": "TEST_PASSED\n" }

      ```


      Example output when the test fails:

      ```json

      { "test_status": "FAILED", "raw_output": "Some unexpected output\n" }

      ```'
    description: Extracts the success indicator from the test execution output, assigns
      a pass/fail status accordingly, and returns a clean JSON summary that preserves
      the raw output verbatim for downstream analysis.
    agent: false
  summarize_test_results:
    name: summarize_test_results
    nodes_depended_on:
    - collect_test_output
    nodes_dependent_on: []
    prompt: 'Generate a concise paragraph that includes the test status and the exact
      raw_output string from the previous step. The summary should:

      1. Clearly state whether the test passed or failed using the keyword "PASSED"
      or "FAILED".

      2. Enclose the full raw_output value in backticks to preserve formatting.

      3. If the raw_output contains multiple lines, maintain the original line breaks
      inside the backticks.

      4. Not add any additional commentary, headings, or formatting beyond what is
      specified.

      The output must be a single paragraph suitable for logging or display.'
    description: Creates a human‑readable summary of test execution results. It receives
      a JSON object containing `test_status` (either "PASSED" or "FAILED") and `raw_output`
      (the full command output). The node must produce a short paragraph that states
      the test outcome, includes the exact raw output wrapped in backticks (preserving
      all whitespace and line breaks), and is formatted for clear, standalone logging
      or display.
    agent: false

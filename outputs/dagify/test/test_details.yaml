name: test
dag_type: plain_text
description: A workflow for testing a hypothesis or idea to determine its validity.
nodes:
  refine_objective:
    name: refine_objective
    nodes_depended_on: []
    nodes_dependent_on: []
    prompt: What is the exact hypothesis or problem you are trying to solve? Be as
      specific as possible.
    description: Clearly articulate the objective or question to be tested.
    agent: false
  determine_scope:
    name: determine_scope
    nodes_depended_on:
    - refine_objective
    nodes_dependent_on: []
    prompt: What specific areas or elements will be evaluated? What will be outside
      of the scope?
    description: Define the boundaries and scope of the test or evaluation.
    agent: false
  identify_required_data:
    name: identify_required_data
    nodes_depended_on:
    - determine_scope
    nodes_dependent_on: []
    prompt: What specific data points are required to answer the objective question?
      Quantitative or qualitative metrics?
    description: Determine what data is necessary for the test or evaluation.
    agent: false
  collect_data:
    name: collect_data
    nodes_depended_on:
    - identify_required_data
    nodes_dependent_on: []
    prompt: Where will the required data be obtained? What sources will be used? How
      will the data be formatted?
    description: Gather and organize the necessary data for the test or evaluation.
    agent: false
  evaluate_evidence:
    name: evaluate_evidence
    nodes_depended_on:
    - collect_data
    nodes_dependent_on: []
    prompt: What specific patterns, trends, or anomalies exist in the data that support
      or contradict the objective? Identify any key insights.
    description: Assess and interpret the collected data in relation to the objective
      question.
    agent: false
  determine_outcome:
    name: determine_outcome
    nodes_depended_on:
    - evaluate_evidence
    nodes_dependent_on: []
    prompt: What does the evidence suggest? Does it support the original hypothesis
      or reveal a different perspective? What does this imply for future action or
      decision-making?
    description: Draw a conclusion or make a decision based on the evaluation of the
      evidence.
    agent: false
  refine_next_steps:
    name: refine_next_steps
    nodes_depended_on:
    - determine_outcome
    nodes_dependent_on: []
    prompt: What specific actions will be taken based on the conclusion? What adjustments
      will be made to future plans or procedures?
    description: Outline and adjust plans for further investigation or implementation
      based on the outcome of the test or evaluation.
    agent: false
